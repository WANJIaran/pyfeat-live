name: windows-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "backend/**"
      - "frontend/**"
      - "pyfeatlive_core/**"
      - "sidecar/**"
      - "tauri/**"
      - "requirements.txt"
      - "tests/core/test_indices*.py"

permissions:
  contents: read

jobs:
  windows-x86_64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test platform-independent index and replay code
        shell: pwsh
        run: |
          python -m pip install pytest pandas
          python -m pytest tests/core/test_indices.py tests/core/test_indices_dataframe.py tests/core/test_serialize_facial_behavior.py -q

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Vendor uv for Windows sidecar bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/uv | Out-Null
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/download/0.10.11/uv-x86_64-pc-windows-msvc.zip -OutFile vendor/uv/uv.zip
          Expand-Archive vendor/uv/uv.zip -DestinationPath vendor/uv/unpacked
          $uv = Get-ChildItem vendor/uv/unpacked -Recurse -Filter uv.exe | Select-Object -First 1
          if (-not $uv) { throw "uv.exe missing from downloaded archive" }
          Copy-Item $uv.FullName vendor/uv/uv-x86_64-pc-windows-msvc.exe

      - name: Install Tauri dependencies
        working-directory: tauri
        run: npm ci

      - name: Build unsigned Windows NSIS installer
        working-directory: tauri
        run: npm run tauri:build -- --bundles nsis --config "src-tauri/tauri.windows.local.conf.json"

      - uses: actions/upload-artifact@v4
        with:
          name: facial-affect-index-windows-x86_64
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
