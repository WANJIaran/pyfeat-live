name: windows-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "backend/**"
      - "frontend/**"
      - "pyfeatlive_core/**"
      - "sidecar/**"
      - "tauri/**"
      - "requirements.txt"
      - "tests/core/test_indices*.py"

permissions:
  contents: read

jobs:
  windows-x86_64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test platform-independent index and replay code
        shell: pwsh
        run: |
          python -m pip install pytest pandas
          python -m pytest tests/core/test_indices.py tests/core/test_indices_dataframe.py tests/core/test_serialize_facial_behavior.py -q

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Vendor uv for Windows sidecar bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/uv | Out-Null
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/download/0.10.11/uv-x86_64-pc-windows-msvc.zip -OutFile vendor/uv/uv.zip
          Expand-Archive vendor/uv/uv.zip -DestinationPath vendor/uv/unpacked
          $uv = Get-ChildItem vendor/uv/unpacked -Recurse -Filter uv.exe | Select-Object -First 1
          if (-not $uv) { throw "uv.exe missing from downloaded archive" }
          Copy-Item $uv.FullName vendor/uv/uv-x86_64-pc-windows-msvc.exe

      - name: Vendor digest-verified LGPL shared FFmpeg
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest
          $asset = $release.assets | Where-Object name -eq "ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          if (-not $asset) { throw "Windows LGPL shared FFmpeg asset is missing" }
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg-shared.zip
          $expected = $asset.digest -replace '^sha256:', ''
          $actual = (Get-FileHash ffmpeg-shared.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA-256 mismatch: $actual != $expected" }
          Expand-Archive ffmpeg-shared.zip -DestinationPath ffmpeg-unpacked
          $root = Get-ChildItem ffmpeg-unpacked -Directory | Select-Object -First 1
          if (-not $root) { throw "FFmpeg archive root is missing" }
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item (Join-Path $root.FullName "bin") vendor/ffmpeg/bin -Recurse
          $dlls = Get-ChildItem vendor/ffmpeg/bin -Filter *.dll
          if (-not $dlls) { throw "Shared FFmpeg archive contains no DLLs" }

      - name: Verify wheel-only Windows first-run dependencies
        shell: pwsh
        run: |
          $uv = "vendor/uv/uv-x86_64-pc-windows-msvc.exe"
          & $uv venv --python 3.12 .windows-lock-venv
          if ($LASTEXITCODE -ne 0) { throw "Could not create Windows runtime test venv" }
          & $uv pip install --dry-run --require-hashes `
            --python .windows-lock-venv/Scripts/python.exe `
            --requirement sidecar/runtime/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime lock requires a source build or is unsatisfiable" }
          & $uv pip install --python .windows-lock-venv/Scripts/python.exe `
            --only-binary :all: torch==2.12.1 torchcodec==0.14.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install TorchCodec smoke-test runtime" }
          $env:PATH = "$(Resolve-Path vendor/ffmpeg/bin);$env:PATH"
          & .windows-lock-venv/Scripts/python.exe -c "import torchcodec; print('TorchCodec + bundled FFmpeg OK')"
          if ($LASTEXITCODE -ne 0) { throw "TorchCodec could not load bundled FFmpeg DLLs" }

      - name: Install Tauri dependencies
        working-directory: tauri
        run: npm ci

      - name: Build unsigned Windows NSIS installer
        working-directory: tauri
        run: npm run tauri:build -- --bundles nsis --config "src-tauri/tauri.windows.local.conf.json"

      - uses: actions/upload-artifact@v4
        with:
          name: facial-affect-index-windows-x86_64
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
